; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ESP32-C3

[env:esp32c3_dev]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

upload_speed = 921600

# CONFIGURACIÓN CRÍTICA PARA ESP32-C3
monitor_speed = 115200                  ; Debe coincidir con Serial.begin()
monitor_rts = 0                         ; ¡IMPORTANTE para ESP32-C3!
monitor_dtr = 0                         ; ¡IMPORTANTE para ESP32-C3!
monitor_port = auto
board_build.usb_cdc_on_boot = 0

# Flags de compilación OBLIGATORIOS
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=1        ; Habilita Serial over USB
    -D ARDUINO_USB_MODE=1               ; Modo USB nativo
    -D ARDUINO_USB_CDC_ON_BOOT=1        ; Doble confirmación

lib_deps =
    https://github.com/HefestoPrimal/Libreria-PDIO.git
    arduino-libraries/NTPClient@^3.2.0
    adafruit/Adafruit SSD1306@^2.5.15
    adafruit/RTClib@^2.1.4
    bblanchon/ArduinoJson@^7.2.0
	me-no-dev/AsyncTCP@^1.1.1
    esphome/ESPAsyncWebServer-esphome@^3.3.0